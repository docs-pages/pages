<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="docs-pages/docs 个人文档站"
    />
    <link rel="icon" href="data:," />
    <base href="./" />
    <title>eastspire</title>
    <style>
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      html body .c_app_main footer.c_euv_footer {
        margin-top: 24px !important;
      }
    </style>
    <script>
      // site-local: re-center the active sidebar entry on viewport resize.
      (function () {
        function scrollActiveToCenter(container) {
          var active = container.querySelector(
            '.c_euv_sidebar_link_active, .c_euv_sidebar_group_title_active'
          );
          if (!active) return;
          var cRect = container.getBoundingClientRect();
          var aRect = active.getBoundingClientRect();
          var target =
            container.scrollTop +
            (aRect.top - cRect.top) -
            (cRect.height - aRect.height) / 2;
          container.scrollTop = Math.max(0, target);
        }
        function run() {
          var containers = document.querySelectorAll('.c_nav_items_scroll');
          for (var i = 0; i < containers.length; i++) {
            scrollActiveToCenter(containers[i]);
          }
        }
        var resizeTimer = 0;
        function schedule() {
          if (resizeTimer) clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            resizeTimer = 0;
            run();
          }, 120);
        }
        window.addEventListener('resize', schedule, { passive: true });
        if (typeof ResizeObserver !== 'undefined') {
          var ro = new ResizeObserver(schedule);
          ro.observe(document.documentElement);
        }
      })();
    </script>
    <script>
      // site-local: prev/next pager for index pages + sibling-scope.
      //
      // Two upstream gaps we're working around in euv-docs:
      //   1. flat_sidebar_links() only walks LEAF entries, so
      //      directory-README pages never get a pager.
      //   2. The flatten is GLOBAL — same-directory siblings would
      //      be far more useful than a cross-tree next leaf.
      //
      // We rebuild the sidebar tree from the rendered DOM, walk it
      // to find the current page's position, and inject a pager
      // with sibling-scope neighbours.
      (function () {
        function buildTree(container) {
          if (!container) return [];
          var out = [];
          for (var i = 0; i < container.children.length; i++) {
            var c = container.children[i];
            var isGroup = c.classList.contains('c_euv_sidebar_group') ||
              (c.className || '').indexOf('c_euv_sidebar_group') >= 0;
            var isLink = c.classList.contains('c_euv_sidebar_link') ||
              (c.className || '').indexOf('c_euv_sidebar_link') >= 0;
            if (!isGroup && !isLink) {
              out = out.concat(buildTree(c));
              continue;
            }
            if (isGroup) {
              var titleNode = c.querySelector(':scope > .c_euv_sidebar_group_title');
              var titleLink = titleNode && titleNode.querySelector('a');
              var titleText = (titleNode && titleNode.textContent || '')
                .replace(/[\u25b8\u25be\u25b2\u25bc]/g, '')
                .trim();
              var titleHref = titleLink && titleLink.getAttribute('href');
              var childContainer = c.querySelector(
                ':scope > .c_euv_sidebar_children'
              );
              var subs = childContainer ? buildTree(childContainer) : [];
              out.push({
                kind: 'group',
                title: titleText,
                href: titleHref || null,
                subs: subs,
              });
            } else if (isLink) {
              out.push({
                kind: 'link',
                title: (c.textContent || '').trim(),
                href: c.getAttribute('href'),
              });
            }
          }
          return out;
        }

        // Strip the leading "#" from a route href so it can be compared
        // against `location.hash` (which never carries the "#").
        function stripHash(href) {
          return (href || '').replace(/^#/, '');
        }

        // Walk the tree and return the closest ancestor whose subtree
        // contains the route. The "siblings" returned are the direct
        // children of that ancestor's subtree, so prev/next pager
        // entries stay inside the same directory.
        //
        // For /essay/public/2025/09-19.html this lands in the 2025/
        // subtree (siblings=[09-19 link]); the next loop on the public/
        // subs also sees 2026/, so the function returns
        // siblings=[2025, 2026] — pager can then walk between the
        // year groups inside the same parent directory.
        function findContaining(subs, route) {
          var needle = stripHash(route);
          return findContainingRec(subs, needle);
        }

        function findContainingRec(subs, needle) {
          for (var i = 0; i < subs.length; i++) {
            var n = subs[i];
            var href = stripHash(n.href);
            if (n.kind === 'link' && href === needle) {
              return { siblings: subs, index: i };
            }
            if (n.kind === 'group') {
              if (href === needle) return { siblings: subs, index: i };
              if (n.subs && n.subs.length) {
                var hit = findContainingRec(n.subs, needle);
                if (hit) {
                  // Promote to the smallest ancestor that has at least
                  // one navigable sibling besides the current route, so
                  // prev/next can walk inside the same directory. For
                  // /essay/public/2026/03-05.html we want siblings=[2025,
                  // 2026] (the parent directory's contents) so prev can
                  // step into the 2025/ group and next can stay inside
                  // 2026/. A leaf's siblings count is too narrow; a
                  // group's own children count works when the leaf is
                  // the only one in its year group (e.g. 09-19 in
                  // 2025/).
                  var parentLeaves = collectLeaves(subs).length;
                  if (parentLeaves >= 2) {
                    return { siblings: subs, index: i };
                  }
                  return hit;
                }
              }
            }
          }
          return null;
        }

        // Pool = every leaf link reachable from the scope's siblings.
        // Group-title entries are skipped — their link is the directory
        // index page, not an article that fits the prev/next pager.
        // We recurse into sub-groups so /essay/public/2025/09-19.html
        // sees /essay/public/2026/ClaudeCode as a sibling candidate
        // (the parent group's "next year" neighbour).
        function collectLeaves(items) {
          var out = [];
          if (!items) return out;
          for (var i = 0; i < items.length; i++) {
            var n = items[i];
            if (n.kind === 'link' && n.href) {
              out.push(n);
            } else if (n.kind === 'group' && n.subs && n.subs.length) {
              out = out.concat(collectLeaves(n.subs));
            }
          }
          return out;
        }

        function itemToPager(it) {
          if (!it) return null;
          return {
            text: it.title || stripHash(it.href),
            href: it.href,
          };
        }

        function computePager(route) {
          var nav = document.querySelector('nav.c_app_nav');
          if (!nav) return null;
          var scroll = nav.querySelector('.c_nav_items_scroll');
          var root = scroll && scroll.children[0];
          if (!root) return null;
          // euv-ui's render is lazy — when a sidebar group is collapsed
          // its children's children container is empty. The active
          // route's ancestors are auto-expanded by `use_sidebar_reveal`,
          // but that runs in a separate reactive cycle. We poke every
          // arrow one extra time so buildTree sees the full tree on
          // first read, then let the existing expand/collapse logic
          // restore user state via the resulting aria-pressed values.
          var arrows = nav.querySelectorAll('.c_euv_sidebar_group_arrow');
          for (var i = 0; i < arrows.length; i++) {
            var a = arrows[i];
            if (
              !a.classList.contains('c_euv_sidebar_group_arrow_open') &&
              a.getAttribute('aria-expanded') !== 'true'
            ) {
              a.click();
            }
          }
          // Re-read the scroll container after the click cascade so we
          // pick up the freshly rendered children containers.
          root = scroll.children[0];
          if (!root) return null;
          var tree = buildTree(root);
          var scope = findContaining(tree, route);
          if (!scope) return null;
          var pool = collectLeaves(scope.siblings);
          var idx = pool.findIndex(function (n) {
            return stripHash(n.href) === stripHash(route);
          });
          if (idx < 0) return null;
          var prev = idx > 0 ? pool[idx - 1] : null;
          var next = idx + 1 < pool.length ? pool[idx + 1] : null;
          return { prev: itemToPager(prev), next: itemToPager(next) };
        }

        function ensurePager() {
          var article = document.querySelector('article');
          if (!article) return;
          var route = location.hash
            ? location.hash.replace(/^#/, '')
            : '/';
          if (!route) route = '/';
          if (document.querySelector('.c_euv_password_gate')) return;
          var pager = computePager(route);
          if (!pager || (!pager.prev && !pager.next)) return;

          var docContent =
            document.querySelector('.c_euv_doc_content') ||
            document.querySelector('article');
          if (!docContent) return;
          var existing = docContent.querySelector('.c_euv_pagination');
          if (existing) {
            while (existing.firstChild) existing.removeChild(existing.firstChild);
          } else {
            existing = document.createElement('div');
            existing.className = 'c_euv_pagination';
            docContent.appendChild(existing);
          }
          if (pager.prev) {
            var a1 = document.createElement('a');
            a1.className = 'c_euv_pagination_link';
            a1.href = pager.prev.href;
            a1.innerHTML =
              '<span class="c_euv_pagination_label"><div style="display: contents;">上一页</div></span>' +
              '<span class="c_euv_pagination_text"><div style="display: contents;"></div></span>';
            a1.querySelector('.c_euv_pagination_text > div').textContent =
              pager.prev.text;
            existing.appendChild(a1);
          }
          if (pager.next) {
            var a2 = document.createElement('a');
            a2.className = 'c_euv_pagination_link c_euv_pagination_next';
            a2.href = pager.next.href;
            a2.innerHTML =
              '<span class="c_euv_pagination_label"><div style="display: contents;">下一页</div></span>' +
              '<span class="c_euv_pagination_text"><div style="display: contents;"></div></span>';
            a2.querySelector('.c_euv_pagination_text > div').textContent =
              pager.next.text;
            existing.appendChild(a2);
          }
        }

        // euv-docs renders into a wasm signal pipeline that produces
        // the <article> element asynchronously after the first paint.
        // We try several detection mechanisms because headless
        // Chromium aggressively throttles timers and RAF when no
        // compositor is active. Each path eventually calls
        // ensurePager(); the rest is a no-op once started=true.
        var started = false;
        function tryStart() {
          if (started) return;
          var article = document.querySelector('article');
          if (!article) return;
          started = true;
          // Run once immediately, then once more on every animation
          // frame for the next 2 seconds. The repeated runs give
          // euv-docs's reactive pager re-render enough chances to be
          // overwritten by our sibling-scope pager, and stop on their
          // own once we know the layout has settled.
          ensurePager();
          var frames = 0;
          function repaint() {
            if (frames++ > 120) return;
            ensurePager();
            requestAnimationFrame(repaint);
          }
          requestAnimationFrame(repaint);
        }
        // MutationObservers — fire immediately on any DOM change.
        new MutationObserver(tryStart).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
        var mainEl = document.querySelector('main');
        if (mainEl) {
          new MutationObserver(tryStart).observe(mainEl, {
            childList: true,
            subtree: true,
          });
        }
        // requestAnimationFrame chain — runs at the next paint.
        function rafChain() {
          if (started) return;
          requestAnimationFrame(rafChain);
          tryStart();
        }
        rafChain();
        // setInterval safety net — 100ms cadence catches the article
        // mount even when RAF is starved.
        var intervalId = setInterval(function () {
          if (started) {
            clearInterval(intervalId);
            return;
          }
          tryStart();
        }, 100);
        // First synchronous attempt.
        tryStart();
        // hashchange handler — re-run for in-app route switches.
        window.addEventListener('hashchange', function () {
          started = false;
          setTimeout(tryStart, 50);
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
  <script type="module">
    import init, { main } from './pkg/euv_docs.js';
    await init();
    main();
  </script>
</html>
