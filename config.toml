# docs-euv site configuration.
#
# This file replaces VuePress's `.vuepress/config.ts`. The build script
# (`build.rs`) reads it together with every `**/*.md` file under `docs/`.

[site]
title = "docs"
description = "docs-pages/docs 个人文档站"
logo = ""

# ── Locales ─────────────────────────────────────────────────────────────────
# Single zh-CN locale. Source content (docs-pages/docs) is all Chinese; we
# serve it from the site root instead of nesting under /zh/.

[[locales]]
prefix = "/"
lang = "zh-CN"
label = "简体中文"
title = "docs"
description = "docs-pages/docs 个人文档站"
footer = "MIT 许可 | 基于 euv + euv-ui 构建"
toc_label = "本页目录"
prev_label = "上一页"
next_label = "下一页"
navbar = [
  { text = "首页", link = "/" },
  { text = "目录", link = "/catalog.html" },
  { text = "GitHub", link = "https://github.com/docs-pages/docs-euv" },
]
